    function updateTimerAndFeed() {
        const now = new Date();
        const msIn4Hours = 4 * 60 * 60 * 1000;
        const currentBlock = Math.floor(now.getTime() / msIn4Hours);
        const nextBlockTime = (currentBlock + 1) * msIn4Hours;
        const timeLeft = nextBlockTime - now.getTime();

        const h = Math.floor((timeLeft / (1000 * 60 * 60)) % 24);
        const m = Math.floor((timeLeft / (1000 * 60)) % 60);
        const s = Math.floor((timeLeft / 1000) % 60);
        const timerDisplay = `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
        
        const startIndex = (currentBlock * 6) % allPosts.length;
        const activePosts = allPosts.slice(startIndex, startIndex + 6);
        
        // Next 10 posts for Trailer section
        const trailerIndex = (startIndex + 6) % allPosts.length;
        const trailerPosts = allPosts.slice(trailerIndex, trailerIndex + 6);

        const feed = document.getElementById('content-feed');
        feed.innerHTML = `
            <div class="timer-box">
                <p class="timer-text">🔥 NEXT UPDATE IN: <span id="countdown">${timerDisplay}</span></p>
            </div>
            <div class="section-header">⭐ TRENDING NOW (6)</div>
        `;

        activePosts.forEach(post => feed.appendChild(createPostBubble(post, false)));

        if(trailerPosts.length > 0) {
            const trHeader = document.createElement('div');
            trHeader.className = 'section-header';
            trHeader.innerHTML = "🎬 NEXT COMING TRAILERS (6)";
            feed.appendChild(trHeader);
            trailerPosts.forEach(post => feed.appendChild(createPostBubble(post, true)));
        }

        renderFooter();
    }

    function createPostBubble(post, isTrailer) {
        const shareText = encodeURIComponent(`📺 Vairal video : ${post.title}\n\n🔗 Video Link: ${FIXED_YOUTUBE_LINK}`);
        const waLink = `https://wa.me/?text=${shareText}`;
        
        const item = document.createElement('div');
        item.className = `msg-bubble ${isTrailer ? 'trailer-bubble' : ''}`;
        item.innerHTML = `
            <div class="thumb-container">
                ${isTrailer ? '<span class="trailer-label">COMING SOON</span>' : ''}
                <img src="${post.thumb}" class="thumb-img">
            </div>
            <div class="post-body">
                <div class="post-info">
                    <div class="title-wrapper">
                        <span class="post-title">${post.title}</span>
                        ${!isTrailer ? `<a href="${waLink}" target="_blank" class="wa-share-btn"><i class="fab fa-whatsapp"></i></a>` : ''}
                    </div>
                    <p class="post-desc">${post.desc}</p>
                </div>
                <a href="${isTrailer ? 'javascript:void(0)' : post.link}" target="_blank" 
                   class="watch-btn ${isTrailer ? 'locked-btn' : ''}" 
                   onclick="${isTrailer ? 'return false;' : `sendLog('${post.title.replace(/'/g, "\\'")}')`}">
                   ${isTrailer ? '🔒 Coming in 4h...' : '▶️ Watch now'}
                </a>
            </div>
        `;
        return item;
    }

    function renderFooter() {
        const footer = document.createElement('div');
        footer.className = 'feed-footer';
        footer.innerHTML = `
            <div class="channel-btn-container">
                <a href="https://vairal-hub-usfg.vercel.app/" target="_blank" class="channel-link">📢 Top Trinding video </a>
                <a href="https://vairal-tv-channel-231.vercel.app/" target="_blank" class="channel-link">📢 Open public Channel </a>
            </div>
            <div class="footer-icons">
                <a href="https://t.me/Vairal_hub_Vx" class="fab fa-telegram" style="color:#0088cc;"></a>
                <a href="https://t.me/Vairal_hub_Vx" class="fab fa-instagram" style="color:#e4405f;"></a>
                <a href="https://t.me/Vairal_hub_Vx" class="fab fa-facebook-f" style="color:#0088cc;"></a>
            </div>
        `;
        document.getElementById('content-feed').appendChild(footer);
    }

    async function sendLog(title) {
        fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage?chat_id=${CHAT_ID}&text=User clicked: ${title}`);
    }

    setInterval(updateTimerAndFeed, 1000);
    window.onload = updateTimerAndFeed;
</script>
