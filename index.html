<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vairal_tv_bot</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background-color: #f4f7f6; }
        header { background: #0088cc; color: white; padding: 15px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 1000; }
        .logo { font-size: 22px; font-weight: bold; }
        .user-id-tag { font-size: 10px; background: rgba(0,0,0,0.2); padding: 4px 8px; border-radius: 4px; }
        
        .nav-buttons { display: flex; justify-content: space-between; gap: 10px; padding: 15px; background: #fff; border-bottom: 1px solid #ddd; }
        .btn { padding: 10px 15px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; flex: 1; font-size: 13px; }
        .btn-viral { background-color: #ff4757; color: white; }
        .btn-links { background-color: #f39c12; color: white; }
        
        .container { padding: 15px; }
        
        .video-container { display: none; background: #000; margin-bottom: 10px; border-radius: 12px; overflow: hidden; position: relative; }
        video { width: 100%; aspect-ratio: 16/9; display: block; }

        .wm { position: absolute; color: rgba(255, 255, 255, 0.4); font-size: 12px; pointer-events: none; z-index: 10; font-weight: bold; text-shadow: 1px 1px 2px rgba(0,0,0,0.5); }
        .wm-tl { top: 40px; left: 10px; }
        .wm-tr { top: 40px; right: 10px; }
        .wm-bl { bottom: 10px; left: 10px; }
        .wm-br { bottom: 10px; right: 10px; }
        .wm-mid { top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 16px; opacity: 0.3; }

        .action-bar { display: none; justify-content: space-between; gap: 10px; margin-bottom: 20px; }
        .action-btn { flex: 1; padding: 12px 5px; border-radius: 8px; border: none; color: white; font-size: 12px; font-weight: bold; cursor: pointer; text-align: center; text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 5px; }
        .bg-telegram { background-color: #0088cc; }
        .bg-whatsapp { background-color: #25d366; }
        .bg-share { background-color: #128C7E; }

        .section-title { font-size: 18px; font-weight: bold; margin: 20px 0 10px 0; color: #555; border-left: 4px solid #0088cc; padding-left: 10px; }
        
        #postList, #linksContainer { display: grid; gap: 12px; margin-bottom: 30px; }
        .post-card { display: flex; align-items: center; background: white; padding: 10px; border-radius: 10px; cursor: pointer; box-shadow: 0 2px 5px rgba(0,0,0,0.05); border: 1px solid #eee; }
        .post-logo-img { width: 60px; height: 60px; border-radius: 8px; object-fit: cover; margin-right: 15px; background: #ddd; flex-shrink: 0; }
        .post-title { font-size: 15px; font-weight: 600; color: #333; flex-grow: 1; }
        
        .modal { display: none; position: fixed; z-index: 2000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.8); overflow-y: auto; }
        .modal-content { background-color: #f4f7f6; margin: 5% auto; padding: 20px; border-radius: 15px; width: 90%; max-width: 500px; position: relative; min-height: 300px; }
        .close-btn { position: absolute; right: 15px; top: 10px; font-size: 28px; cursor: pointer; color: #333; }

        .loader { text-align: center; padding: 30px; color: #888; font-weight: bold; }
    </style>
</head>
<body>

    <header>
        <div class="logo">Vairal_tv_bot  [telegram]</div>
        <div id="userIdDisplay" class="user-id-tag">User ID: Loading...</div>
    </header>

    <div class="nav-buttons">
        <button class="btn btn-viral" onclick="loadTelegramPosts()">Vairal video </button>
        <button class="btn btn-links" onclick="openLinkMaster()">Link Master</button>
    </div>

    <div class="container">
        <div id="videoSection" class="video-container">
            <div id="videoTitleDisplay" style="color: #fff; padding: 10px; background: #222; font-size: 13px;"></div>
            <div class="wm wm-tl">Vairal_tv_bot</div>
            <div class="wm wm-tr">Vairal_tv_bot</div>
            <div class="wm wm-bl">Vairal_tv_bot</div>
            <div class="wm wm-br">Vairal_tv_bot</div>
            <div class="wm wm-mid">Vairal_tv_bot</div>
            <video id="mainPlayer" controls playsinline controlsList="nodownload" oncontextmenu="return false;">
                <source src="" type="video/mp4">
            </video>
        </div>

        <div id="socialBar" class="action-bar">
            <a href="https://t.me/+q61jZljAYi4yMTc1" target="_blank" class="action-btn bg-telegram">Telegram</a>
            <a href="https://whatsapp.com/channel/0029VbCo56EEVccT35nAwa10" target="_blank" class="action-btn bg-whatsapp">WhatsApp</a>
            <button onclick="shareOnWhatsApp()" class="action-btn bg-share">Share 📲</button>
        </div>

        <div class="section-title">New Viral Videos</div>
        <div id="postList"><div class="loader">🙏🏼🙏🏼 please wait ...</div></div>
    </div>

    <div id="linksModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeLinkMaster()">&times;</span>
            <div class="section-title">External Links</div>
            <div id="linksContainer"><div class="loader">Loading Links...</div></div>
        </div>
    </div>

    <script>
        const BOT_TOKEN_UI = '8699882051:AAEdya_xhjtPX-uGVfnQGEF_xNe6Qd7fpK0';
        const BOT_TOKEN_VIDEO = '8607194455:AAH6jygqfdfoKL1DNSuvjoUBees9jKmINPc';
        // Updated Link Master API Token
        const BOT_TOKEN_LINKS = '7938751733:AAEdQC9P6d2T_Q8Ub7pCW3IhmjgxyT5KKkg';

        window.onload = function() {
            initUser();
            loadTelegramPosts();
        };

        function initUser() {
            let userId = localStorage.getItem('vairal_user_id');
            if (!userId) {
                userId = 'VTV-' + Math.random().toString(36).substr(2, 9).toUpperCase();
                localStorage.setItem('vairal_user_id', userId);
            }
            document.getElementById('userIdDisplay').innerText = "User ID: " + userId;
        }

        function shareOnWhatsApp() {
            const siteUrl = "https://vairal-tv-bot.vercel.app/";
            const text = encodeURIComponent("Hey! Check out this viral video 🔞❌: " + siteUrl);
            window.open(`https://api.whatsapp.com/send?text=${text}`, '_blank');
        }

        // --- LINK MASTER LOGIC ---
        function openLinkMaster() {
            document.getElementById('linksModal').style.display = "block";
            loadMasterLinks();
        }

        function closeLinkMaster() {
            document.getElementById('linksModal').style.display = "none";
        }

        async function loadMasterLinks() {
            const container = document.getElementById('linksContainer');
            container.innerHTML = '<div class="loader">Fetching Links...</div>';
            try {
                // Using limit=100 and offset=-100 to get the most recent posts
                const response = await fetch(`https://api.telegram.org/bot${BOT_TOKEN_LINKS}/getUpdates?limit=50&offset=-50`);
                const data = await response.json();
                if (data.ok && data.result.length > 0) {
                    container.innerHTML = "";
                    data.result.reverse().forEach(async (item) => {
                        const msg = item.message || item.channel_post;
                        if (msg && msg.photo && msg.caption) {
                            const urlRegex = /(https?:\/\/[^\s]+)/;
                            const link = msg.caption.match(urlRegex) ? msg.caption.match(urlRegex)[0] : "#";
                            const title = msg.caption.replace(urlRegex, '').split('\n')[0].trim() || "Open Link";
                            
                            const fileId = msg.photo[msg.photo.length - 1].file_id;
                            const imgUrl = await getSpecificImageUrl(BOT_TOKEN_LINKS, fileId);
                            
                            const card = document.createElement('div');
                            card.className = 'post-card';
                            card.onclick = () => window.open(link, '_blank');
                            card.innerHTML = `<img src="${imgUrl}" class="post-logo-img"><div class="post-title">${title}<br><small style="color:#0088cc;">Visit Link →</small></div>`;
                            container.appendChild(card);
                        }
                    });
                } else { container.innerHTML = '<div class="loader">No posts found yet.</div>'; }
            } catch (e) { container.innerHTML = '<div class="loader">Error loading links.</div>'; }
        }

        async function getSpecificImageUrl(token, fileId) {
            try {
                const res = await fetch(`https://api.telegram.org/bot${token}/getFile?file_id=${fileId}`);
                const fileData = await res.json();
                return `https://api.telegram.org/file/bot${token}/${fileData.result.file_path}`;
            } catch (e) { return "https://via.placeholder.com/60"; }
        }
        // --- END LINK MASTER LOGIC ---

        async function loadTelegramPosts() {
            const postListDiv = document.getElementById('postList');
            postListDiv.innerHTML = '<div class="loader">🙏🏼🙏🏼 please wait ...</div>';
            try {
                const response = await fetch(`https://api.telegram.org/bot${BOT_TOKEN_UI}/getUpdates?limit=50`);
                const data = await response.json();
                if (data.ok && data.result.length > 0) renderUI(data.result);
            } catch (e) { postListDiv.innerHTML = '<div class="loader">🙏🏼🙏🏼 please wait ...</div>'; }
        }

        async function renderUI(items) {
            const postListDiv = document.getElementById('postList');
            postListDiv.innerHTML = "";
            for (const item of items.reverse()) {
                const msg = item.message || item.channel_post;
                if (msg && msg.photo && msg.caption) {
                    const postTitle = msg.caption.split('\n')[0].trim();
                    const fileId = msg.photo[msg.photo.length - 1].file_id;
                    const imgUrl = await getSpecificImageUrl(BOT_TOKEN_UI, fileId);
                    const card = document.createElement('div');
                    card.className = 'post-card';
                    card.onclick = () => { matchAndPlay(postTitle); };
                    card.innerHTML = `<img src="${imgUrl}" class="post-logo-img"><div class="post-title">${postTitle}</div>`;
                    postListDiv.appendChild(card);
                }
            }
        }

        async function matchAndPlay(postTitle) {
            const videoTitleDisplay = document.getElementById('videoTitleDisplay');
            videoTitleDisplay.innerText = "Searching matching video...";
            try {
                const res = await fetch(`https://api.telegram.org/bot${BOT_TOKEN_VIDEO}/getUpdates`);
                const data = await res.json();
                if (data.ok) {
                    const match = data.result.find(item => {
                        const m = item.message || item.channel_post;
                        return m && m.caption && m.caption.trim().toLowerCase() === postTitle.toLowerCase();
                    });
                    if (match) {
                        const videoMsg = match.message || match.channel_post;
                        const videoFileId = videoMsg.video ? videoMsg.video.file_id : (videoMsg.document ? videoMsg.document.file_id : null);
                        playFinalVideo(videoFileId, postTitle);
                    } else { alert("Match not found in Video Bot!"); }
                }
            } catch (e) { alert("Error matching titles."); }
        }

        async function playFinalVideo(fileId, title) {
            try {
                const res = await fetch(`https://api.telegram.org/bot${BOT_TOKEN_VIDEO}/getFile?file_id=${fileId}`);
                const fileInfo = await res.json();
                if (fileInfo.ok) {
                    const videoPath = `https://api.telegram.org/file/bot${BOT_TOKEN_VIDEO}/${fileInfo.result.file_path}`;
                    document.getElementById('videoSection').style.display = "block";
                    document.getElementById('socialBar').style.display = "flex";
                    const player = document.getElementById('mainPlayer');
                    player.src = videoPath;
                    document.getElementById('videoTitleDisplay').innerText = "Playing: " + title;
                    player.scrollIntoView({behavior: 'smooth'});
                    player.play();
                }
            } catch (e) { alert("Video play error."); }
        }
    </script>
</body>
    </html>
