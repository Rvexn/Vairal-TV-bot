<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trending Filter Chat</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: #e5ddd5; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

        .header { background: #075e54; color: white; padding: 12px 15px; display: flex; align-items: center; gap: 10px; font-weight: bold; }
        .online-dot { width: 10px; height: 10px; background: #25d366; border-radius: 50%; }

        #chat-window { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 15px; }
        
        #trending-area { background: #fff; padding: 10px; border-radius: 10px; margin-bottom: 10px; border: 1px solid #ccc; }
        .trending-title { font-size: 12px; font-weight: bold; color: #075e54; margin-bottom: 8px; display: block; }
        .trend-tag { display: inline-block; background: #e1f5fe; color: #0288d1; padding: 5px 12px; border-radius: 20px; font-size: 12px; margin-right: 5px; margin-bottom: 5px; cursor: pointer; border: 1px solid #b3e5fc; transition: 0.2s; }
        .trend-tag:hover { background: #0288d1; color: white; }

        .bubble { max-width: 85%; padding: 10px 14px; border-radius: 12px; font-size: 14px; line-height: 1.5; position: relative; box-shadow: 0 1px 2px rgba(0,0,0,0.1); }
        .user-msg { background: #dcf8c6; align-self: flex-end; border-top-right-radius: 0; }
        .bot-msg { background: #ffffff; align-self: flex-start; border-top-left-radius: 0; border-left: 4px solid #24A1DE; }

        /* INSTAGRAM BUTTON STYLE */
        .insta-btn { display: inline-block; background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%); color: white !important; padding: 8px 15px; border-radius: 5px; text-decoration: none; font-weight: bold; font-size: 13px; margin-top: 10px; }
        .insta-btn i { margin-right: 5px; }

        .video-card { background: #fff; border-radius: 10px; overflow: hidden; border: 1px solid #ddd; margin-top: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        .video-card img { width: 100%; height: auto; display: block; }
        .video-info { padding: 12px; }
        .btn-link { display: block; background: #24A1DE; color: white !important; text-align: center; padding: 10px; border-radius: 6px; text-decoration: none; font-weight: bold; margin-top: 10px; }

        .time { font-size: 10px; color: #999; text-align: right; margin-top: 5px; }

        .input-bar { background: #f0f0f0; padding: 10px; display: flex; gap: 10px; align-items: center; border-top: 1px solid #ddd; }
        .input-bar input { flex: 1; padding: 12px 18px; border-radius: 25px; border: none; outline: none; }
        .send-btn { background: #075e54; color: white; border: none; width: 45px; height: 45px; border-radius: 50%; cursor: pointer; }
    </style>
</head>
<body>

    <div class="header">
        <div class="online-dot"></div>
        <span>Vairal TV bot</span>
    </div>

    <div id="chat-window">
        <div id="trending-area">
            <span class="trending-title"><i class="fas fa-fire"></i> Trending Videos</span>
            <div id="trend-list">Loading trends...</div>
        </div>

        <div class="bubble bot-msg">
            <div style="font-size: 11px; font-weight: bold; color: #24A1DE; margin-bottom: 4px;">System</div>
            Welcome! to Vairal TV bot.... Up jis video dekna chatty ho, charge karo video miljayeggi Or Help kya liye Instagram par SMS karo. Thank you 🙏🏼 🙏🏼 .
            <br>
            <a href="https://www.instagram.com/vairal_tv_bot?igsh=aTJmc3JsbHN1dmNr" target="_blank" class="insta-btn">
                <i class="fab fa-instagram"></i> Follow Instagram
            </a>
            <div class="time">Just now</div>
        </div>
    </div>

    <div class="input-bar">
        <input type="text" id="chat-input" placeholder="Type keyword...">
        <button class="send-btn" onclick="handleUserChat()">
            <i class="fas fa-paper-plane"></i>
        </button>
    </div>

    <script>
        const BOT_TOKEN = '7938751733:AAEdQC9P6d2T_Q8Ub7pCW3IhmjgxyT5KKkg';
        const CHAT_ID = '6262892880';
        const INSTA_URL = "https://www.instagram.com/vairal_tv_bot?igsh=aTJmc3JsbHN1dmNr"; // Apna link yahan dalein

        document.addEventListener('DOMContentLoaded', () => {
            updateTrendingUI();
        });

        function handleUserChat(manualText = null) {
            const input = document.getElementById('chat-input');
            const userText = manualText || input.value.trim();
            
            if (!userText) return;

            renderMessage(userText, 'user-msg', 'You');
            input.value = '';

            const savedPosts = JSON.parse(localStorage.getItem('advance_auto_posts')) || {};
            let clickData = JSON.parse(localStorage.getItem('post_clicks')) || {};
            const lowerUserText = userText.toLowerCase();

            setTimeout(() => {
                let found = false;
                for (let keyword in savedPosts) {
                    if (lowerUserText.includes(keyword)) {
                        const post = savedPosts[keyword];
                        if(post.hidden === true) continue; 

                        clickData[keyword] = (clickData[keyword] || 0) + 1;
                        localStorage.setItem('post_clicks', JSON.stringify(clickData));
                        updateTrendingUI();

                        const cardHTML = `
                            <div class="video-card">
                                <img src="${post.thumb}">
                                <div class="video-info">
                                    <span style="font-weight:bold;">${post.title}</span>
                                    <a href="${post.url}" target="_blank" class="btn-link">
                                        <i class="fas fa-play-circle"></i> Watch Full Video
                                    </a>
                                </div>
                            </div>`;
                        
                        renderMessage(cardHTML, 'bot-msg', 'Auto Bot');
                        found = true;
                        break;
                    }
                }
                
                // --- NO RESULTS MESSAGE WITH INSTA BUTTON ---
                if (!found) {
                    const noResultHTML = `
                        Sorry, is naam se koi video nahi hai. Help ke liye Instagram par SMS karo.
                        <br>
                        <a href="${INSTA_URL}" target="_blank" class="insta-btn">
                            <i class="fab fa-instagram"></i> Follow on Instagram
                        </a>`;
                    renderMessage(noResultHTML, 'bot-msg', 'Auto Bot');
                }
                
                logToTelegram(userText);
            }, 600);
        }

        function updateTrendingUI() {
            const trendList = document.getElementById('trend-list');
            const clickData = JSON.parse(localStorage.getItem('post_clicks')) || {};
            const savedPosts = JSON.parse(localStorage.getItem('advance_auto_posts')) || {};
            
            const sorted = Object.entries(clickData)
                .filter(([key]) => savedPosts[key] && !savedPosts[key].hidden)
                .sort((a, b) => b[1] - a[1])
                .slice(0, 5);

            if (sorted.length === 0) {
                trendList.innerHTML = '<span style="font-size:11px; color:#999;">Search to see trends</span>';
                return;
            }

            trendList.innerHTML = '';
            sorted.forEach(([key, clicks]) => {
                const tag = document.createElement('span');
                tag.className = 'trend-tag';
                tag.innerHTML = `#${key}`;
                tag.onclick = () => handleUserChat(key);
                trendList.appendChild(tag);
            });
        }

        function renderMessage(text, className, sender) {
            const window = document.getElementById('chat-window');
            const displayTime = new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
            
            const html = `
                <div class="bubble ${className}">
                    <div style="font-size: 10px; font-weight: bold; margin-bottom: 3px; opacity: 0.8;">${sender}</div>
                    <div>${text}</div>
                    <div class="time">${displayTime}</div>
                </div>`;
            
            window.insertAdjacentHTML('beforeend', html);
            window.scrollTop = window.scrollHeight;
        }

        async function logToTelegram(text) {
            try {
                await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ chat_id: CHAT_ID, text: `User Searched: ${text}` })
                });
            } catch (e) {}
        }
    </script>
</body>
  </html>
